[project]
name = "mixcut-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for MixCut."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.0",
  "uvicorn[standard]>=0.46.0",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.14.0",
  "structlog>=25.5.0",
  "celery>=5.6.0",
  "redis>=7.4.0",
  "anyio>=4.13.0",
  "anthropic>=0.100.0",
  "openai>=2.36.0",
  "google-genai>=2.0.0",
  "httpx>=0.28.0",
  "sqlalchemy[asyncio]>=2.0.49",
  "asyncpg>=0.31.0",
  "alembic>=1.18.0",
  "opentelemetry-api>=1.41.0",
  "opentelemetry-sdk>=1.41.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.41.0",
  "prometheus-client>=0.25.0",
  "langgraph>=1.1.0",
]

[project.optional-dependencies]
s3 = [
  "aioboto3>=15.0.0",
]
checkpoint = [
  "langgraph-checkpoint-postgres>=3.0.0",
]
whisper = [
  "openai-whisper>=20250625",
]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.15.0",
  "aiosqlite>=0.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
